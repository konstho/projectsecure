<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Shop{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        nav { border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        input, textarea { padding: 5px; margin: 5px 0; width: 250px; }
        textarea { width: 100%; height: 60px; }
        .error { color: red; }
        .review { border: 1px solid #ddd; padding: 8px; margin: 8px 0; }
        .admin-box { background: #fff3cd; border: 1px solid #ffc107; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>

<nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('search') }}">Search</a>
    {% if session.user %}
        <a href="{{ url_for('orders') }}">My Orders</a>
        {% if session.user == 'admin' %}
            <a href="{{ url_for('admin') }}"><b>Admin Panel</b></a>
        {% endif %}
        | Logged in as <b>{{ session.user }}</b>
        <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
        <a href="{{ url_for('login') }}">Login</a>
    {% endif %}
</nav>

{% block content %}{% endblock %}

</body>
</html>
